<nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
  <div class="max-w-3xl mx-auto px-4 flex items-center h-14">
    <span class="font-bold text-gray-800 text-base">韓文單字學習</span>
  </div>
</nav>

<div class="flex-1 flex flex-col overflow-hidden bg-gray-50 pb-16 lg:pb-0">
  <router-outlet />
</div>

<!-- Settings floating card -->
@if (settingsOpen) {
  <div class="fixed inset-0 z-40" (click)="closeSettings()"></div>
  <div
    class="fixed bottom-[68px] left-3 right-3 z-50 sm:left-auto sm:right-4 sm:w-72"
    (click)="$event.stopPropagation()"
  >
    <app-settings></app-settings>
  </div>
}

<!-- Mobile bottom nav -->
<nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex z-30">
  <button
    (click)="goWordList()"
    class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 transition-colors"
    [class.text-blue-600]="isOnWords"
    [class.text-gray-400]="!isOnWords"
  >
    <i class="fas fa-book text-xl"></i>
    <span class="text-[10px]">單字庫</span>
  </button>

  <a
    routerLink="/quiz"
    routerLinkActive
    #quizLink="routerLinkActive"
    class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 transition-colors"
    [class.text-blue-600]="quizLink.isActive"
    [class.text-gray-400]="!quizLink.isActive"
  >
    <i class="fas fa-pen-to-square text-xl"></i>
    <span class="text-[10px]">出考題</span>
  </a>

  <button
    (click)="openSettings()"
    class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 transition-colors"
    [class.text-blue-600]="settingsOpen"
    [class.text-gray-400]="!settingsOpen"
  >
    <i class="fas fa-gear text-xl"></i>
    <span class="text-[10px]">設定</span>
  </button>

  <button
    (click)="addWord()"
    class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-gray-400 hover:text-gray-600 transition-colors"
  >
    <i class="fas fa-plus text-xl"></i>
    <span class="text-[10px]">新增單字</span>
  </button>
</nav>
