<div class="max-w-lg mx-auto px-4 py-6 pb-24 sm:pb-6">
  <form [formGroup]="form" (ngSubmit)="generate()" class="space-y-6">

    <!-- 題數 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">題數</label>
      <input
        type="number"
        formControlName="count"
        min="1"
        class="w-full px-3 py-2 border border-gray-300 rounded-md text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      @if (form.get('count')?.invalid && form.get('count')?.touched) {
        <p class="mt-1 text-xs text-red-600">題數至少為 1</p>
      }
      <p class="mt-1 text-xs text-gray-400">單字庫共 {{ totalWords }} 筆</p>
    </div>

    <!-- Choose quiz direction -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">出題方向</label>
      <div class="flex gap-3">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" formControlName="direction" value="ko-to-zh" class="text-blue-600" />
          <span class="text-sm text-gray-700">韓文 → 中文</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" formControlName="direction" value="zh-to-ko" class="text-blue-600" />
          <span class="text-sm text-gray-700">中文 → 韓文</span>
        </label>
      </div>
    </div>

    <!-- 出題範圍 -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">出題範圍</label>
      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          (click)="setSource('all')"
          [class.bg-blue-600]="selectedSource === 'all'"
          [class.text-white]="selectedSource === 'all'"
          [class.border-blue-600]="selectedSource === 'all'"
          [class.bg-white]="selectedSource !== 'all'"
          [class.text-gray-700]="selectedSource !== 'all'"
          [class.border-gray-300]="selectedSource !== 'all'"
          class="px-3 py-1.5 text-sm border rounded-full transition-colors hover:border-blue-400"
        ><i class="fas fa-book"></i> 所有單字</button>

        <button
          type="button"
          (click)="setSource('favorites')"
          [class.bg-blue-600]="selectedSource === 'favorites'"
          [class.text-white]="selectedSource === 'favorites'"
          [class.border-blue-600]="selectedSource === 'favorites'"
          [class.bg-white]="selectedSource !== 'favorites'"
          [class.text-gray-700]="selectedSource !== 'favorites'"
          [class.border-gray-300]="selectedSource !== 'favorites'"
          class="px-3 py-1.5 text-sm border rounded-full transition-colors hover:border-blue-400"
        ><i class="fas fa-star"></i> 收藏</button>

        @for (folder of folders; track folder.id) {
          <button
            type="button"
            (click)="setSource(folder.id!)"
            [class.bg-blue-600]="selectedSource === folder.id"
            [class.text-white]="selectedSource === folder.id"
            [class.border-blue-600]="selectedSource === folder.id"
            [class.bg-white]="selectedSource !== folder.id"
            [class.text-gray-700]="selectedSource !== folder.id"
            [class.border-gray-300]="selectedSource !== folder.id"
            class="px-3 py-1.5 text-sm border rounded-full transition-colors hover:border-blue-400"
          ><i class="fas fa-folder"></i> {{ folder.name }}</button>
        }
      </div>
    </div>

    <!-- 匯出按鈕 -->
    <button
      type="submit"
      [disabled]="totalWords === 0"
      class="w-full py-3 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      匯出
    </button>

    @if (totalWords === 0) {
      <p class="text-center text-sm text-gray-400">請先在單字庫新增單字</p>
    }

  </form>
</div>
